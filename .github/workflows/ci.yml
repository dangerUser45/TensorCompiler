name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

env:
  LLVM_VERSION: "18"

jobs:
  clang-format-check:
    name: Clang-Format
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-${LLVM_VERSION}

      - name: Check formatting
        shell: bash
        run: |
          mapfile -t files < <(git ls-files '*.cpp' '*.hpp')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No C++ source files found"
            exit 0
          fi

          clang-format-${LLVM_VERSION} -style=file -i "${files[@]}"

          if ! git diff --exit-code -- "${files[@]}"; then
            echo "Formatting check failed. Run:"
            echo "  clang-format -style=file -i \$(git ls-files '*.cpp' '*.hpp')"
            exit 1
          fi

  frontend-build-and-test:
    name: Frontend Build & Test (${{ matrix.build_type }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            protobuf-compiler \
            libprotobuf-dev \
            libgtest-dev

      - name: Configure
        run: |
          cmake -S frontend -B frontend/build-${{ matrix.build_type }} \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build frontend/build-${{ matrix.build_type }} --parallel

      - name: Test
        run: ctest --test-dir frontend/build-${{ matrix.build_type }} --output-on-failure

      - name: Handoff CLI smoke
        if: matrix.build_type == 'Release'
        shell: bash
        run: |
          driver="frontend/build-${{ matrix.build_type }}/frontend_driver"
          tmp_dir="${RUNNER_TEMP}/tc-handoff"
          mkdir -p "${tmp_dir}"

          "${driver}" frontend/models/exec_conv_relu.onnx --verify-exec
          "${driver}" frontend/models/exec_conv_relu.onnx --emit-mlir="${tmp_dir}/exec_conv_relu.mlir"
          "${driver}" frontend/models/exec_conv_relu.onnx --emit-metadata="${tmp_dir}/exec_conv_relu.json"

          grep -q "func.func @tc_model" "${tmp_dir}/exec_conv_relu.mlir"
          grep -q "linalg.conv_2d_nchw_fchw" "${tmp_dir}/exec_conv_relu.mlir"
          grep -q '"model_entry": "tc_model"' "${tmp_dir}/exec_conv_relu.json"

  backend-build-and-test:
    name: Backend Build & Test (${{ matrix.build_type }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-${LLVM_VERSION} \
            cmake \
            ninja-build \
            llvm-${LLVM_VERSION} \
            llvm-${LLVM_VERSION}-dev \
            libmlir-${LLVM_VERSION}-dev \
            mlir-${LLVM_VERSION}-tools

      - name: Add LLVM tools to PATH
        run: echo "/usr/lib/llvm-${LLVM_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: |
          cmake -S backend -B backend/build-${{ matrix.build_type }} \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DLLVM_DIR="/usr/lib/llvm-${LLVM_VERSION}/lib/cmake/llvm" \
            -DMLIR_DIR="/usr/lib/llvm-${LLVM_VERSION}/lib/cmake/mlir"

      - name: Build
        run: cmake --build backend/build-${{ matrix.build_type }} --parallel

      - name: Test
        run: ctest --test-dir backend/build-${{ matrix.build_type }} --output-on-failure
