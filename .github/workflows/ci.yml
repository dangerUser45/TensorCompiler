name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - dev
      - main

jobs:
  frontend-build-and-test:
    name: Frontend Build & Test (${{ matrix.build_type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            protobuf-compiler \
            libprotobuf-dev \
            libgtest-dev \
            clang-format

      - name: Configure
        run: |
          cmake -S frontend -B frontend/build-${{ matrix.build_type }} \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build frontend/build-${{ matrix.build_type }} --parallel

      - name: Test
        run: ctest --test-dir frontend/build-${{ matrix.build_type }} --output-on-failure

  backend-build-and-test:
    name: Backend Build & Test (${{ matrix.build_type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect backend project
        id: backend_project
        shell: bash
        run: |
          if [[ -f backend/CMakeLists.txt ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Backend project detected"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Backend project is absent, backend job steps will be skipped"
          fi

      - name: Install dependencies
        if: steps.backend_project.outputs.present == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            llvm \
            llvm-dev

      - name: Configure
        if: steps.backend_project.outputs.present == 'true'
        run: |
          cmake -S backend -B backend/build-${{ matrix.build_type }} \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DLLVM_DIR="$(llvm-config --cmakedir)"

      - name: Build
        if: steps.backend_project.outputs.present == 'true'
        run: cmake --build backend/build-${{ matrix.build_type }} --parallel

      - name: Test
        if: steps.backend_project.outputs.present == 'true'
        run: ctest --test-dir backend/build-${{ matrix.build_type }} --output-on-failure

  clang-format-check:
    name: Clang-Format (PR to dev/main)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && (github.base_ref == 'dev' || github.base_ref == 'main')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Check formatting
        run: |
          mapfile -t files < <(git ls-files | grep -E '^frontend/.*\.(cpp|hpp)$' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No C++ source files found"
            exit 0
          fi

          clang-format -style=file -i "${files[@]}"

          if ! git diff --exit-code -- "${files[@]}"; then
            echo "Formatting check failed. Run:"
            echo "  clang-format -style=file -i frontend/include/*.hpp frontend/src/*.cpp frontend/tests/**/*.cpp"
            exit 1
          fi
